# /etc/smartd.conf on crab. Only the data HDD (sda) gets scheduled self-tests;
# the NVMe drives are watched for health and errors only.
#   -a              monitor all attributes and the error/self-test logs
#   -o on -S on     automatic offline data collection, attribute autosave
#   -s ...          short test daily 12:00, long test (about 4.5 h) Saturday 13:00,
#                   after the PBS verify job (Sat 10:00) and outside Tdarr's 03:00-09:00
#   -W 4,45,50      warn on a 4 C jump, log at 45 C, alert at 50 C
#   -M exec         alerts go to Telegram through smartd-telegram.sh
/dev/disk/by-id/ata-ST2000VX015-2XG102_<SERIAL> -d sat -a -o on -S on -s (S/../.././12|L/../../6/13) -W 4,45,50 -m root -M exec /usr/local/bin/smartd-telegram.sh
/dev/nvme0 -a -W 0,60,70 -m root -M exec /usr/local/bin/smartd-telegram.sh
/dev/nvme1 -a -W 0,60,70 -m root -M exec /usr/local/bin/smartd-telegram.sh
