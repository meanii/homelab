# /etc/systemd/system/beszel-agent.service.d/smart.conf
# Lets the unprivileged agent read S.M.A.R.T. data (https://beszel.dev/guide/smart-data).
# NVMe is read through the namespace device (/dev/nvmeXn1, group disk) because the
# controller node /dev/nvmeX is root-only. Set SMART_DEVICES per host.
[Service]
AmbientCapabilities=CAP_SYS_RAWIO CAP_SYS_ADMIN
CapabilityBoundingSet=CAP_SYS_RAWIO CAP_SYS_ADMIN
SupplementaryGroups=disk
Environment="SMART_DEVICES=/dev/nvme0n1:nvme,/dev/sda"
