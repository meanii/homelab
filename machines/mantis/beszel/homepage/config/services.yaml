- Media:
    - Jellyfin:
        proxmoxNode: home
        proxmoxVMID: 116
        proxmoxType: lxc
        icon: jellyfin.svg
        href: https://jellyfin.home.aniicrite.dev
        siteMonitor: http://10.10.10.116:8096/health
        widget:
          type: jellyfin
          url: http://10.10.10.116:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          version: 2 # Jellyfin 12 API
    - Requests:
        proxmoxNode: home
        proxmoxVMID: 117
        proxmoxType: lxc
        icon: jellyseerr.svg
        href: https://requests.home.aniicrite.dev
