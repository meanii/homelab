        href: https://tdarr.home.aniicrite.dev
        widget:
          type: tdarr
          url: http://10.10.10.118:8265
- Calendar:
    - Upcoming:
        widget:
          type: calendar
          view: agenda
          maxEvents: 10
          previousDays: 3
          showTime: true
          integrations:
            - type: sonarr
              service_group: Downloads
              service_name: Sonarr
            - type: radarr
              service_group: Downloads
              service_name: Radarr
