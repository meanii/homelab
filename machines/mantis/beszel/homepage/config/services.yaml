- Infrastructure:
    - Proxmox:
        icon: proxmox.svg
        href: https://proxmox.home.aniicrite.dev
        siteMonitor: https://192.168.0.122:8006
        widget:
          type: proxmox
          url: https://192.168.0.122:8006
          username: "{{HOMEPAGE_VAR_PVE_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN}}"
          node: home
    - Media storage:
        icon: mdi-harddisk
        description: crab HDD, media quota
        href: https://dash.home.aniicrite.dev
        widget:
          type: customapi
          url: https://192.168.0.122:8006/api2/json/nodes/home/storage/crab-media/status
          headers:
            Authorization: "PVEAPIToken={{HOMEPAGE_VAR_PVE_TOKEN_ID}}={{HOMEPAGE_VAR_PVE_TOKEN}}"
          mappings:
            - field: { data: used }
              label: Used
              format: bytes
            - field: { data: avail }
              label: Free
              format: bytes
            - field: { data: total }
              label: Quota
              format: bytes
    - Backup server:
        icon: proxmox-backup-server.svg
        href: https://pbs.home.aniicrite.dev
        widget:
          type: proxmoxbackupserver
          url: https://192.168.0.10:8007
          username: "{{HOMEPAGE_VAR_PBS_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PBS_TOKEN}}"
    - Beszel:
        proxmoxNode: home
        proxmoxVMID: 109
        proxmoxType: lxc
        icon: beszel.svg
        href: https://beszel.home.aniicrite.dev
