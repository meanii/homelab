# Internal URLs use vmbr1 (10.10.10.x); CT 109 is on that bridge.
- Machines:
    - mantis:
        icon: mdi-server
        description: Proxmox VE
        href: https://beszel.home.aniicrite.dev
        widget:
          type: beszel
          url: http://10.10.10.109:8090
          username: "{{HOMEPAGE_VAR_BESZEL_USER}}"
          password: "{{HOMEPAGE_VAR_BESZEL_PASS}}"
          version: 2
          systemId: mantis
          fields: ["cpu", "memory", "disk"]
