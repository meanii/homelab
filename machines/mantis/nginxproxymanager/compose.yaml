---
# /root/compose.yaml in CT 107 (nginxproxymanager)
services:
  nginxproxymanager:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80" # Public HTTP Port
      - "443:443" # Public HTTPS Port
      - "81:81" # Admin Web Port
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

  # tinyauth: forward-auth login in front of NPM hosts, backed by PocketID (CT 115)
  tinyauth:
    container_name: tinyauth
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    restart: unless-stopped
    env_file: tinyauth.env # see tinyauth/tinyauth.env.example
    volumes:
      - ./tinyauth:/data # users.txt, sessions database, OIDC keys

  # frp client: tunnel to frps on beetle
  frpc:
    image: ghcr.io/fatedier/frpc:v0.71.0
    container_name: frpc
    restart: unless-stopped
    env_file: .env # FRP_AUTH_TOKEN
    network_mode: "host" # Needed to access local services
    volumes:
      - ./frpc.toml:/etc/frpc.toml:ro
    command: -c /etc/frpc.toml
